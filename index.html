<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投資大作戰 💚 初階・中階・高階 100 幕火柴人投資漫畫</title>
  <meta name="description" content="Undertale 風格火柴人漫畫互動教學《投資大作戰》：由小綠帶領完成初階、中階、高階共 100 幕，從 0 學會風險、槓桿、FX戰士久留美經典爆倉教訓與台灣真實破產案例。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app-container">
    <!-- ==================== SCREEN 1: TITLE SCREEN ==================== -->
    <section id="screen-title" class="title-screen">
      <div class="title-kicker">💚 小綠的 16 歲投資冒險 ｜ 初・中・高階共 100 幕</div>
      <h1 class="game-title"><span class="hl">投資</span>大作戰</h1>

      <div class="title-stage-box">
        <canvas id="title-canvas"></canvas>
      </div>

      <div class="title-actions">
        <!-- Shown when saved progress exists -->
        <button id="btn-continue" class="ut-btn primary hidden">▶ 繼續上次的進度</button>
        <p id="save-note" class="title-save-note hidden"></p>

        <!-- Primary START button -->
        <button id="btn-start" class="ut-btn primary">▶ START</button>
        <p id="first-play-note" class="title-save-note">🌱 初階 (1-33) ➔ ⚡ 中階 (34-66) ➔ 🏆 高階 (67-100)</p>
      </div>

      <!-- 3-Tier Direct Entry (shown cleanly once player has started or wants to pick a tier) -->
      <div id="tier-row" class="tier-row hidden"></div>
    </section>

    <!-- ==================== SCREEN 2: STORY COMIC SCREEN ==================== -->
    <section id="screen-story" class="story-screen hidden">
      <!-- Quiet minimal progress header -->
      <div class="story-meta-bar">
        <div>
          <span class="tier-pill" id="tier-pill">🌱 初階</span>
          <span class="chapter-label" id="chapter-label">第 1 章</span>
        </div>
        <div class="meta-right">
          <span id="page-counter">1 / 90</span>
          <button id="btn-to-title" class="mute-tiny-btn" aria-label="回標題選等級">回標題</button>
          <button id="btn-mute" class="mute-tiny-btn" aria-label="音效開關">🔊 音效</button>
        </div>
      </div>

      <!-- 1 Big Animated Alan Becker Stickman Comic Panel -->
      <div class="comic-frame" id="comic-frame">
        <canvas id="comic-canvas"></canvas>
      </div>

      <!-- Classic Undertale Black/White Dialogue Box -->
      <div class="ut-dialogue-box" id="dialogue-box" title="點一下可快速顯示完整句子">
        <div class="portrait-wrap">
          <canvas id="portrait-canvas" width="96" height="96"></canvas>
        </div>
        <div class="dialogue-body">
          <div class="speaker-name" id="speaker-name">小綠</div>
          <p class="dialogue-text" id="dialogue-text"></p>
        </div>
      </div>

      <!-- Undertale 2-Choice Decision Box (shown only on the 9 choice scenes) -->
      <div id="choice-panel" class="choice-panel hidden">
        <div class="choice-prompt" id="choice-prompt"></div>
        <div class="choice-grid" id="choice-grid"></div>
      </div>

      <!-- Navigation: Strictly Prev & Next (or Retry on Game Over) -->
      <div id="nav-row" class="nav-row">
        <button id="btn-prev" class="ut-btn">◀ 上一頁</button>
        <button id="btn-next" class="ut-btn primary">下一頁 ▶</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
